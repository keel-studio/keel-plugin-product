# The plugin's manifest. Draft: the code still lives in keel-v2, so nothing is released yet.
# Format: https://github.com/MiladNalbandi/keel-v2/tree/main/docs/plugins/02-plugin-package.md
schema: 1
name: product
title: "keel Product"
version: 0.0.0
publisher: keel
summary: "Initiatives, teams and product docs, from idea to the teams' stories, with their own workflows and agents. Beta."
repo: https://github.com/keel-studio/keel-plugin-product
license: MIT

requires:
  sdk: 1
  plugins:
    tasks: ">=0.1.0"
    jira: ">=0.1.0"

parts:
  engine: { path: engine, package: keel_plugin_product }
  api: { jars: [api/keel-plugin-product.jar] }
  web: { entry: web/index.js }
  content: content
  migrations: migrations
